<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Execute: different instructions use different paths</title><desc id="desc">ADD R1, R2: Read register operands → ALU sum → write R1.. LOAD R1, [0x200]: Read data memory → write R1 in our absolute-address model.. STORE [0x200], R1: Read R1 → write data memory at 0x200.. Real address generation: A load/store may also use an ALU or AGU for base + offset.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">Execute: different instructions use different paths</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">ADD R1, R2</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Read register operands → ALU sum → write R1.</text>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">LOAD R1, [0x200]</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Read data memory → write R1 in our absolute-address model.</text>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">STORE [0x200], R1</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Read R1 → write data memory at 0x200.</text>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Real address generation</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">A load/store may also use an ALU or AGU for base + offset.</text>
<text x="36" y="530" font-family="Arial, sans-serif" font-size="16" fill="#526577">Original teaching illustration; assumptions are explained in the chapter.</text>
</svg>