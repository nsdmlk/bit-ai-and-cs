<title id="title">Teaching translation: a = b + c</title><desc id="desc">Load inputs: R1 ← memory[0x300] = 4; R2 ← memory[0x304] = 6.. Add: ADD R3, R1, R2 computes R3 = 10.. Store output: STORE [0x308], R3 writes 10 to the location for a.. Scope: Illustrative pseudocode; a real compiler may choose another sequence.</desc>
