<title id="title">Hardware carries out the program</title><desc id="desc">Software: Describes operations using instructions and data.. Physical processor: Fetches and executes instructions using circuits.. Memory and storage: Keep working values and saved files in different forms.. Input/output: Connects computation to users, devices and networks.</desc>
