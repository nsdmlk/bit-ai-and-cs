<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">A mixed worked example</title><desc id="desc">Trace a load: Instruction at 0x100 reads value 42 from data address 0x200.. Track the state: After fetch PC = 0x104; after execute R1 = 42.. Calculate CPU time: 4,000,000 × 1.5 / (2 × 10^9) = 3 ms.. Check assumptions: Four-byte teaching instructions; fixed 2 GHz; stated average CPI.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">A mixed worked example</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Trace a load</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Instruction at 0x100 reads value 42 from data address 0x200.</text>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Track the state</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">After fetch PC = 0x104; after execute R1 = 42.</text>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Calculate CPU time</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">4,000,000 × 1.5 / (2 × 10^9) = 3 ms.</text>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Check assumptions</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Four-byte teaching instructions; fixed 2 GHz; stated average CPI.</text>
<text x="36" y="530" font-family="Arial, sans-serif" font-size="16" fill="#526577">Original teaching illustration; assumptions are explained in the chapter.</text>
</svg>