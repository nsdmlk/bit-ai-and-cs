<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Choose hardware for the workload</title><desc id="desc">CPU: Flexible instruction execution and control-heavy work.. GPU / accelerator: Can exploit suitable parallel workloads and numerical operations.. Costs: Data movement, memory capacity, software and task size matter.. No universal winner: Small or unsuitable tasks may gain little from offloading.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">Choose hardware for the workload</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">CPU</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Flexible instruction execution and control-heavy work.</text>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">GPU / accelerator</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Can exploit suitable parallel workloads and numerical operations.</text>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Costs</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Data movement, memory capacity, software and task size matter.</text>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">No universal winner</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Small or unsuitable tasks may gain little from offloading.</text>
<text x="36" y="530" font-family="Arial, sans-serif" font-size="16" fill="#526577">Original teaching illustration; assumptions are explained in the chapter.</text>
</svg>