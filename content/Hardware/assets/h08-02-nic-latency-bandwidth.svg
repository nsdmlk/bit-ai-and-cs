<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Network delay and capacity answer different questions</title><desc id="desc">NIC: A physical network interface; one kind of I/O hardware.. Latency: Delay until data travels or an exchange completes.. Bandwidth: A capacity/rate measure, usually stated in bits per second.. Application effect: Response delay and bulk-transfer time can have different bottlenecks.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">Network delay and capacity answer different questions</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">NIC</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">A physical network interface; one kind of I/O hardware.</text>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Latency</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Delay until data travels or an exchange completes.</text>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Bandwidth</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">A capacity/rate measure, usually stated in bits per second.</text>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Application effect</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Response delay and bulk-transfer time can have different bottlenecks.</text>
