<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Kitchen analogy: roles, not literal equivalence</title><desc id="desc">Recipe → program: A description of operations to perform.. Cook → processor: Carries out the operations.. Counter → working memory: Keeps ingredients currently in use close to the work.. Pantry → persistent storage: Keeps supplies between sessions; devices supply input/output.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">Kitchen analogy: roles, not literal equivalence</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Recipe → program</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">A description of operations to perform.</text>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Cook → processor</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Carries out the operations.</text>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Counter → working memory</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Keeps ingredients currently in use close to the work.</text>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Pantry → persistent storage</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Keeps supplies between sessions; devices supply input/output.</text>
<text x="36" y="530" font-family="Arial, sans-serif" font-size="16" fill="#526577">Original teaching illustration; assumptions are explained in the chapter.</text>
</svg>