<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Clock period is the reciprocal of frequency</title><desc id="desc">Frequency f: Cycles per second; 2 GHz = 2 × 10^9 Hz.. Period T: Seconds per cycle; T = 1 / f.. Example: At 2 GHz, T = 0.5 ns; at 2.5 GHz, T = 0.4 ns.. Interpretation: A shorter cycle alone does not fix instruction count or average CPI.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">Clock period is the reciprocal of frequency</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Frequency f</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Cycles per second; 2 GHz = 2 × 10^9 Hz.</text>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Period T</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Seconds per cycle; T = 1 / f.</text>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Example</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">At 2 GHz, T = 0.5 ns; at 2.5 GHz, T = 0.4 ns.</text>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Interpretation</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">A shorter cycle alone does not fix instruction count or average CPI.</text>
<text x="36" y="530" font-family="Arial, sans-serif" font-size="16" fill="#526577">Original teaching illustration; assumptions are explained in the chapter.</text>
</svg>