<title id="title">No overlap: three instructions need nine cycles</title><desc id="desc">Instruction 1: Fetch cycle 1; decode cycle 2; execute cycle 3.. Instruction 2: Fetch cycle 4; decode cycle 5; execute cycle 6.. Instruction 3: Fetch cycle 7; decode cycle 8; execute cycle 9.. Assumptions: Three one-cycle phases; sequential execution; fixed cycle duration.</desc>
