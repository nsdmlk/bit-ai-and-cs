<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">Control and calculation have different jobs</title><desc id="desc">Decode: Read opcode and operand fields from the instruction.. Select: Choose operand paths and the required ALU operation.. Enable: Permit the appropriate register or memory write.. Separate roles: Control directs the datapath; the ALU performs arithmetic/logic.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">Control and calculation have different jobs</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Decode</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Read opcode and operand fields from the instruction.</text>
<path d="M500 155 V173" stroke="#50718d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Select</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Choose operand paths and the required ALU operation.</text>
<path d="M500 260 V278" stroke="#50718d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Enable</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Permit the appropriate register or memory write.</text>
<path d="M500 365 V383" stroke="#50718d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Separate roles</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">Control directs the datapath; the ALU performs arithmetic/logic.</text>
<text x="36" y="530" font-family="Arial, sans-serif" font-size="16" fill="#526577">Original teaching illustration; assumptions are explained in the chapter.</text>
</svg>