<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">A higher clock can give the same CPU time</title><desc id="desc">Common workload: 2,000,000 completed instructions; constant clock assumed.. CPU A: CPI 2 at 2 GHz → 2,000,000 × 2 / (2 × 10^9) = 2 ms.. CPU B: CPI 3 at 3 GHz → 2,000,000 × 3 / (3 × 10^9) = 2 ms.. Conclusion: For these inputs the times match; frequency alone is insufficient.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#50718d"/></marker></defs>
<text x="36" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">A higher clock can give the same CPU time</text>
<rect x="36" y="70" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="101" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Common workload</text>
<text x="58" y="131" font-family="Arial, sans-serif" font-size="20" fill="#28465e">2,000,000 completed instructions; constant clock assumed.</text>
<rect x="36" y="175" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="206" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">CPU A</text>
<text x="58" y="236" font-family="Arial, sans-serif" font-size="20" fill="#28465e">CPI 2 at 2 GHz → 2,000,000 × 2 / (2 × 10^9) = 2 ms.</text>
<rect x="36" y="280" width="928" height="84" rx="10" fill="#edf4fa" stroke="#acc0ce"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">CPU B</text>
<text x="58" y="341" font-family="Arial, sans-serif" font-size="20" fill="#28465e">CPI 3 at 3 GHz → 2,000,000 × 3 / (3 × 10^9) = 2 ms.</text>
<rect x="36" y="385" width="928" height="84" rx="10" fill="#eff7f2" stroke="#acc0ce"/>
<text x="58" y="416" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">Conclusion</text>
<text x="58" y="446" font-family="Arial, sans-serif" font-size="20" fill="#28465e">For these inputs the times match; frequency alone is insufficient.</text>
<text x="36" y="530" font-family="Arial, sans-serif" font-size="16" fill="#526577">Original teaching illustration; assumptions are explained in the chapter.</text>
</svg>