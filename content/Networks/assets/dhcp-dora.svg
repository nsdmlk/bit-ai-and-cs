<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">A typical new DHCPv4 allocation</title>
<desc id="desc">The client sends Discover, the server sends Offer, the client sends its selecting Request, and the selected server sends ACK. Broadcast discovery does not imply every later DHCP message is broadcast.</desc>
<rect width="1000" height="490" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315c87"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#17324d">
<text x="35" y="42" font-size="28" font-weight="bold">A typical new DHCPv4 allocation</text>
<text x="80" y="94" font-size="23" font-weight="bold">Client (UDP 68)</text>
<text x="690" y="94" font-size="23" font-weight="bold">Server (UDP 67)</text>
<path d="M180 112 V414 M810 112 V414" stroke="#a9bccb" stroke-width="3"/>
<g stroke="#315c87" stroke-width="3" marker-end="url(#arrow)">
<path d="M180 155 H810"/><path d="M810 229 H180"/><path d="M180 303 H810"/><path d="M810 377 H180"/>
</g>
<g font-size="21" text-anchor="middle">
<text x="495" y="143">1. Discover: find servers (broadcast)</text>
<text x="495" y="217">2. Offer: proposed address and settings</text>
<text x="495" y="291">3. Request: select an offer (broadcast)</text>
<text x="495" y="365">4. ACK: confirm lease and configuration</text>
</g>
<text x="35" y="451" font-size="17">Illustrative allocation on one LAN. Relays and renewal exchanges can use other message paths.</text>
<text x="35" y="477" font-size="17">Original teaching diagram. Sources and lease-expiry scenario are provided in the chapter.</text>
</g></svg>
